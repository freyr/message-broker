services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    volumes:
      - .:/app
      - ${COMPOSER_HOME}:/.composer:consistent
    environment:
      # The adapters require freyr/message-broker ^0.15, and the root package is the core: Composer
      # needs its version. Change it with COMPOSER_ROOT_VERSION of .github/workflows/tests.yml at each minor release of the core.
      COMPOSER_ROOT_VERSION: "0.15.0"
      POSTGRES_DSN: "pgsql:host=postgres;port=5432;dbname=message_broker_test"
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_USER: guest
      AMQP_PASSWORD: guest
      AMQP_VHOST: "/"
      WEBHOOK_SERVER_URL: "http://webhook-server:8080"
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      webhook-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: message_broker_test
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d message_broker_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Transaction-mode pooler for `make test-pgbouncer` (not used by the default test run).
  # server_round_robin and min_pool_size force a new server connection between two
  # consecutive transactions of one client. max_prepared_statements must be above 0 (200 is
  # the default since 1.24.0): pdo_pgsql sends the prepare and the execute as separate round
  # trips, and in transaction mode each can go to a different server connection.
  # No DB_NAME: a wildcard entry for every database. See storage/postgresql/docs/CONNECTION_POOLING.md.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: broker
      DB_PASSWORD: broker
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      SERVER_ROUND_ROBIN: "1"
      MIN_POOL_SIZE: "2"
      DEFAULT_POOL_SIZE: "4"
      MAX_PREPARED_STATEMENTS: "200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U broker -d message_broker_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Test HTTP server of the webhook-http tests and the webhook benchmark: tools/webhook-test-server/server.mjs
  # (Node.js, built-in modules only). No host port: the php service reaches it by its service name.
  webhook-server:
    image: node:22-alpine
    command: ["node", "/srv/server.mjs"]
    volumes:
      - ./tools/webhook-test-server:/srv:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/_health"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Redis of the ratelimit-redis tests (suite ratelimit-redis). No host port and no volume: the tests need no state between runs.
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
  rabbitmq_data:
