services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    volumes:
      - .:/app
      - ${COMPOSER_HOME}:/.composer:consistent
    environment:
      POSTGRES_DSN: "pgsql:host=postgres;port=5432;dbname=message_broker_test"
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      AMQP_HOST: rabbitmq
      AMQP_PORT: "5672"
      AMQP_USER: guest
      AMQP_PASSWORD: guest
      AMQP_VHOST: "/"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: message_broker_test
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d message_broker_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Transaction-mode pooler for `make test-pgbouncer` (not used by the default test run).
  # server_round_robin and min_pool_size force a new server connection between two
  # consecutive transactions of one client; max_prepared_statements = 0 turns off the
  # tracking of named prepared statements. No DB_NAME: a wildcard entry for every database.
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: broker
      DB_PASSWORD: broker
      AUTH_TYPE: scram-sha-256
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      SERVER_ROUND_ROBIN: "1"
      MIN_POOL_SIZE: "2"
      DEFAULT_POOL_SIZE: "4"
      MAX_PREPARED_STATEMENTS: "0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U broker -d message_broker_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.3.1-management-alpine
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
