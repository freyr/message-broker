# Dependency rules between the packages of the repo. Each layer is selected by the folder of its package.
# See "Layout" in CLAUDE.md. Run: vendor/bin/deptrac analyse
deptrac:
  paths:
    - ./src
    - ./storage/postgresql/src
    - ./transport/amqp/src
    - ./webhook/http/src
    - ./ratelimit/redis/src
  layers:
    # The core is src/ at the repo root: each src/ that is not the src/ of an adapter folder.
    - name: Core
      collectors:
        - type: directory
          value: ^(?!.*/(storage|transport|webhook|ratelimit)/[^/]+/src/).*/src/.*
    - name: StoragePostgreSql
      collectors:
        - type: directory
          value: /storage/postgresql/src/.*
    - name: TransportAmqp
      collectors:
        - type: directory
          value: /transport/amqp/src/.*
    - name: WebhookHttp
      collectors:
        - type: directory
          value: /webhook/http/src/.*
    - name: RateLimitRedis
      collectors:
        - type: directory
          value: /ratelimit/redis/src/.*
    - name: Pdo
      collectors:
        - type: classNameRegex
          value: '#^(PDO|PDOStatement|PDOException|Pdo\\.+)$#'
    - name: PhpAmqpLib
      collectors:
        - type: classNameRegex
          value: '#^PhpAmqpLib\\.+#'
    # NoPrivateNetworkHttpClient needs IpUtils of HttpFoundation; the HTTP adapter uses the same list for its pre-check.
    - name: SymfonyHttpClient
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\(Component\\HttpClient|Contracts\\HttpClient|Component\\HttpFoundation)\\.+#'
    # The Redis clients that the Redis adapter accepts: phpredis (Redis, RedisCluster), Relay and Predis.
    - name: RedisClient
      collectors:
        - type: classNameRegex
          value: '#^(Redis|RedisCluster|RedisException|RedisClusterException|Relay\\.+|Predis\\.+)$#'
  ruleset:
    Core: []
    StoragePostgreSql:
      - Core
      - Pdo
    TransportAmqp:
      - Core
      - PhpAmqpLib
    WebhookHttp:
      - Core
      - SymfonyHttpClient
    RateLimitRedis:
      - Core
      - RedisClient
