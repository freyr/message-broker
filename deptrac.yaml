# Dependency rules between the layers of the package. See "Layout" in CLAUDE.md.
# Run: vendor/bin/deptrac analyse
deptrac:
  paths:
    - ./src
  layers:
    - name: Core
      collectors:
        - type: directory
          value: src/broker/.*
    - name: PostgreSql
      collectors:
        - type: directory
          value: src/adapter/postgresql/.*
    - name: Amqp
      collectors:
        - type: directory
          value: src/adapter/amqp/.*
    - name: Http
      collectors:
        - type: directory
          value: src/adapter/http/.*
    - name: Pdo
      collectors:
        - type: classNameRegex
          value: '#^(PDO|PDOStatement|PDOException|Pdo\\.+)$#'
    - name: PhpAmqpLib
      collectors:
        - type: classNameRegex
          value: '#^PhpAmqpLib\\.+#'
    # NoPrivateNetworkHttpClient needs IpUtils of HttpFoundation; the HTTP adapter uses the same list for its pre-check.
    - name: SymfonyHttpClient
      collectors:
        - type: classNameRegex
          value: '#^Symfony\\(Component\\HttpClient|Contracts\\HttpClient|Component\\HttpFoundation)\\.+#'
  ruleset:
    Core: []
    PostgreSql:
      - Core
      - Pdo
    Amqp:
      - Core
      - PhpAmqpLib
    Http:
      - Core
      - SymfonyHttpClient
