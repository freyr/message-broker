# Dependency rules between the layers of the package. See "Layout" in CLAUDE.md.
# Run: vendor/bin/deptrac analyse
deptrac:
  paths:
    - ./src
  layers:
    - name: Core
      collectors:
        - type: directory
          value: src/broker/.*
    - name: PostgreSql
      collectors:
        - type: directory
          value: src/adapter/postgresql/.*
    - name: Amqp
      collectors:
        - type: directory
          value: src/adapter/amqp/.*
    - name: Pdo
      collectors:
        - type: classNameRegex
          value: '#^(PDO|PDOStatement|PDOException|Pdo\\.+)$#'
    - name: PhpAmqpLib
      collectors:
        - type: classNameRegex
          value: '#^PhpAmqpLib\\.+#'
  ruleset:
    Core: []
    PostgreSql:
      - Core
      - Pdo
    Amqp:
      - Core
      - PhpAmqpLib
