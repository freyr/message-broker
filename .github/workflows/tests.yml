name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # The adapters require freyr/message-broker ^0.15, and the root package is the core: Composer needs its
  # version for the development install. Change it with compose.yaml at each minor release of the core.
  COMPOSER_ROOT_VERSION: "0.15.0"

jobs:
  # Code style does not depend on the runtime: ECS runs once, on the lowest supported PHP.
  ecs:
    name: ECS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/ecs check

  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --memory-limit=-1

  deptrac:
    name: Deptrac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/deptrac analyse --no-progress

  functional-tests:
    name: Functional Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      # Redis of the suite ratelimit-redis (the Redis rate limit store).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, sockets, mbstring, pcntl, redis
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      # The test HTTP server of the suite webhook-http (tools/webhook-test-server/server.mjs: Node.js, built-in modules only;
      # the runner has Node.js). A service container cannot run it: services start before the checkout.
      - name: Start the webhook test server
        run: |
          nohup node tools/webhook-test-server/server.mjs > "${RUNNER_TEMP}/webhook-server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/_health > /dev/null && exit 0; sleep 1; done
          cat "${RUNNER_TEMP}/webhook-server.log"; exit 1

      - name: Run tests
        env:
          POSTGRES_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=message_broker_test"
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
          AMQP_HOST: 127.0.0.1
          AMQP_PORT: "5672"
          AMQP_USER: guest
          AMQP_PASSWORD: guest
          AMQP_VHOST: "/"
          WEBHOOK_SERVER_URL: "http://localhost:8080"
          REDIS_HOST: 127.0.0.1
        run: vendor/bin/phpunit

  # Infection runs on the newest supported PHP only. The test suite is the same on each version,
  # and a run on 8.4 and on 8.5 gave the same result, so a second run would only double the time.
  mutation:
    name: Mutation Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      # Redis of the suite ratelimit-redis (the Redis rate limit store).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      POSTGRES_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=message_broker_test"
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      AMQP_HOST: 127.0.0.1
      AMQP_PORT: "5672"
      AMQP_USER: guest
      AMQP_PASSWORD: guest
      AMQP_VHOST: "/"
      WEBHOOK_SERVER_URL: "http://localhost:8080"
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the PR run compares with the base branch

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, sockets, mbstring, pcntl, redis
          coverage: pcov
          # The src/ folders of all packages; the path packages in vendor/ are symlinks to them.
          ini-values: pcov.directory=., pcov.exclude="~/vendor/~"
          tools: composer:v2

      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      # The test HTTP server of the suite webhook-http (tools/webhook-test-server/server.mjs: Node.js, built-in modules only;
      # the runner has Node.js). A service container cannot run it: services start before the checkout.
      - name: Start the webhook test server
        run: |
          nohup node tools/webhook-test-server/server.mjs > "${RUNNER_TEMP}/webhook-server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/_health > /dev/null && exit 0; sleep 1; done
          cat "${RUNNER_TEMP}/webhook-server.log"; exit 1

      # Pull request: mutate only the changed lines of src/ and of the src/ folder of each adapter.
      # The whole-code configuration and its thresholds: infection.repo.json5.
      - name: Mutation tests (changed lines)
        if: github.event_name == 'pull_request'
        run: >-
          vendor/bin/infection --configuration=infection.repo.json5 --threads=max --no-progress --logger-github
          --git-diff-lines --git-diff-base=origin/${{ github.base_ref }}
          --ignore-msi-with-no-mutations

      # main: the full run keeps the score at or above the baseline.
      - name: Mutation tests (full)
        if: github.event_name == 'push'
        run: vendor/bin/infection --configuration=infection.repo.json5 --threads=max --no-progress --logger-github=false

  # Advisory: PHP 8.6 is not released yet (GA planned 2026-11-19). A failure here does not block a merge:
  # this job has continue-on-error and is not in the needs of ci-gate. In setup-php, '8.6' is the
  # nightly build from the PHP-8.6 branch. No dependency forbids PHP 8.6, so no --ignore-platform-req
  # flag is needed; if one starts to, add `--ignore-platform-req=php+` to the composer command of this job only.
  php-8-6-advisory:
    name: PHP 8.6 (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      # Redis of the suite ratelimit-redis (the Redis rate limit store).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          extensions: pdo_pgsql, sockets, mbstring, pcntl, redis
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      # The test HTTP server of the suite webhook-http (tools/webhook-test-server/server.mjs: Node.js, built-in modules only;
      # the runner has Node.js). A service container cannot run it: services start before the checkout.
      - name: Start the webhook test server
        run: |
          nohup node tools/webhook-test-server/server.mjs > "${RUNNER_TEMP}/webhook-server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/_health > /dev/null && exit 0; sleep 1; done
          cat "${RUNNER_TEMP}/webhook-server.log"; exit 1

      - name: Run tests (unit and functional)
        env:
          POSTGRES_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=message_broker_test"
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
          AMQP_HOST: 127.0.0.1
          AMQP_PORT: "5672"
          AMQP_USER: guest
          AMQP_PASSWORD: guest
          AMQP_VHOST: "/"
          WEBHOOK_SERVER_URL: "http://localhost:8080"
          REDIS_HOST: 127.0.0.1
        run: vendor/bin/phpunit

  # One job for each package (see "Packages and split rehearsal" in CLAUDE.md) and each PHP version: the package is
  # copied to a temporary folder, installed ALONE against the core of the checkout through Composer path
  # repositories, and its tests run alone. On main, the PHP 8.4 entry also runs Infection with the configuration
  # of the package. The core entry uses no service; storage-postgresql needs PostgreSQL; transport-amqp needs
  # PostgreSQL and RabbitMQ; webhook-http needs PostgreSQL and the webhook test server; ratelimit-redis needs Redis.
  # All entries have all services, for a simple matrix.
  split-rehearsal:
    name: Package ${{ matrix.package }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, storage-postgresql, transport-amqp, webhook-http, ratelimit-redis]
        php: ['8.4', '8.5']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      # Redis of the suite ratelimit-redis (the Redis rate limit store).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      POSTGRES_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=message_broker_test"
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      AMQP_HOST: 127.0.0.1
      AMQP_PORT: "5672"
      AMQP_USER: guest
      AMQP_PASSWORD: guest
      AMQP_VHOST: "/"
      WEBHOOK_SERVER_URL: "http://localhost:8080"
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v7

      # pcov is only needed for Infection, which runs on main on PHP 8.4.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, sockets, mbstring, pcntl, redis
          coverage: ${{ (github.event_name == 'push' && matrix.php == '8.4') && 'pcov' || 'none' }}
          tools: composer:v2

      # The test HTTP server of the suite webhook-http (tools/webhook-test-server/server.mjs: Node.js, built-in modules only;
      # the runner has Node.js). A service container cannot run it: services start before the checkout.
      - name: Start the webhook test server
        run: |
          nohup node tools/webhook-test-server/server.mjs > "${RUNNER_TEMP}/webhook-server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/_health > /dev/null && exit 0; sleep 1; done
          cat "${RUNNER_TEMP}/webhook-server.log"; exit 1

      - name: Install the package alone and run its tests
        if: github.event_name == 'pull_request' || matrix.php != '8.4'
        run: tools/split-rehearsal.sh ${{ matrix.package }}

      - name: Install the package alone and run its tests and Infection
        if: github.event_name == 'push' && matrix.php == '8.4'
        run: tools/split-rehearsal.sh ${{ matrix.package }} --infection

  # Advisory, pull requests only: each adapter with the LOWEST core that its constraint accepts, from Packagist
  # (tools/split-rehearsal.sh --lowest: no path repository for the core; storage-postgresql stays a path package
  # for transport-amqp and webhook-http). A pull request can use a core method that Packagist does not have yet,
  # so a failure does not block a merge: continue-on-error, and not in the needs of ci-gate. On main the same
  # check runs in release.yml after the packagist job. A failure there means that the adapter needs a higher core floor.
  lowest:
    name: Lowest core (${{ matrix.package }}, advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package: [storage-postgresql, transport-amqp, webhook-http, ratelimit-redis]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      # Redis of the suite ratelimit-redis (the Redis rate limit store).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      POSTGRES_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=message_broker_test"
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      AMQP_HOST: 127.0.0.1
      AMQP_PORT: "5672"
      AMQP_USER: guest
      AMQP_PASSWORD: guest
      AMQP_VHOST: "/"
      WEBHOOK_SERVER_URL: "http://localhost:8080"
      REDIS_HOST: 127.0.0.1

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sockets, mbstring, pcntl, redis
          coverage: none
          tools: composer:v2

      # The test HTTP server of the suite webhook-http (tools/webhook-test-server/server.mjs: Node.js, built-in modules only;
      # the runner has Node.js). A service container cannot run it: services start before the checkout.
      - name: Start the webhook test server
        run: |
          nohup node tools/webhook-test-server/server.mjs > "${RUNNER_TEMP}/webhook-server.log" 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/_health > /dev/null && exit 0; sleep 1; done
          cat "${RUNNER_TEMP}/webhook-server.log"; exit 1

      - name: Install the adapter with the lowest core from Packagist and run its tests
        run: tools/split-rehearsal.sh ${{ matrix.package }} --lowest

  # The PostgreSQL contract tests and the consumer functional tests through pgbouncer in transaction mode
  # (the same settings as the pgbouncer service of compose.yaml and `make test-pgbouncer`). It keeps the
  # statement of storage/postgresql/docs/CONNECTION_POOLING.md true. The pooler is a service, so it starts before the steps.
  # The guard test runs first: when the pooler does not rotate server connections, the other steps prove nothing.
  # PHP 8.4 only: pooling does not depend on the PHP version. The timeout stops a run that hangs on a wrong
  # pooler setting (with max_prepared_statements = 0 a run hung and a server connection went out of sync).
  pgbouncer:
    name: pgbouncer (transaction mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      # DB_HOST is the label of the postgres service on the job network. No DB_NAME: a wildcard database entry.
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_USER: broker
          DB_PASSWORD: broker
          AUTH_TYPE: scram-sha-256
          LISTEN_PORT: "6432"
          POOL_MODE: transaction
          SERVER_ROUND_ROBIN: "1"
          MIN_POOL_SIZE: "2"
          DEFAULT_POOL_SIZE: "4"
          # Must be above 0 (200 is the default since 1.24.0): pdo_pgsql sends the prepare and the execute as
          # separate round trips, and in transaction mode each can go to a different server connection.
          MAX_PREPARED_STATEMENTS: "200"
        ports:
          - 6432:6432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -p 6432 -U broker -d message_broker_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      POSTGRES_DSN: "pgsql:host=127.0.0.1;port=6432;dbname=message_broker_test"
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_ROTATING_POOLER: "1"
      AMQP_HOST: 127.0.0.1
      AMQP_PORT: "5672"
      AMQP_USER: guest
      AMQP_PASSWORD: guest
      AMQP_VHOST: "/"

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sockets, mbstring, pcntl
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Guard (the pooler rotates server connections)
        run: vendor/bin/phpunit --fail-on-skipped storage/postgresql/tests/Functional/PoolerRotationGuardTest.php

      - name: Contract tests and consumer functional tests through pgbouncer
        run: >-
          vendor/bin/phpunit
          storage/postgresql/tests/Functional/PostgreSqlOutboxStoreContractTest.php
          storage/postgresql/tests/Functional/PostgreSqlDeduplicationStoreContractTest.php
          storage/postgresql/tests/Functional/PostgreSqlDeadLetterStoreContractTest.php
          storage/postgresql/tests/Functional/PostgreSqlDeliveryStoreContractTest.php
          storage/postgresql/tests/Functional/PostgreSqlRateLimiterContractTest.php
          storage/postgresql/tests/Functional/PostgreSqlCircuitBreakerContractTest.php
          storage/postgresql/tests/Functional/PostgreSqlLaneStatesContractTest.php
          storage/postgresql/tests/Functional/PdoTransactionContractTest.php
          storage/postgresql/tests/Functional/WebhookEndToEndTest.php
          transport/amqp/tests/Functional/AmqpConsumerTest.php
          transport/amqp/tests/Functional/EndToEndTest.php
          transport/amqp/tests/Functional/ParallelConsumptionTest.php

  # The suite ratelimit-redis against Valkey 8 (the Redis rate limit store supports Redis 7.0 or later and Valkey 7.2 or later).
  # The suite needs no PostgreSQL and no RabbitMQ. The other jobs run it against Redis 7.
  valkey:
    name: Valkey 8 (suite ratelimit-redis)
    runs-on: ubuntu-latest

    services:
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, redis
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run the suite ratelimit-redis
        env:
          REDIS_HOST: 127.0.0.1
        run: vendor/bin/phpunit --testsuite ratelimit-redis

  ci-gate:
    name: ci-gate
    if: always()
    needs: [ecs, phpstan, deptrac, functional-tests, mutation, split-rehearsal, pgbouncer, valkey]
    runs-on: ubuntu-latest
    steps:
      - uses: freyr/.github/actions/ci-gate@b0c5431e29887b95f0031751c6d92506a2b2fc81 # v2.0.0
        with:
          results: ${{ join(needs.*.result, ' ') }}
