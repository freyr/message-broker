name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Code style does not depend on the runtime: ECS runs once, on the lowest supported PHP.
  ecs:
    name: ECS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/ecs check

  phpstan:
    name: PHPStan (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --memory-limit=-1

  deptrac:
    name: Deptrac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/deptrac analyse --no-progress

  functional-tests:
    name: Functional Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, sockets, mbstring, pcntl
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        env:
          POSTGRES_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=message_broker_test"
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
          AMQP_HOST: 127.0.0.1
          AMQP_PORT: "5672"
          AMQP_USER: guest
          AMQP_PASSWORD: guest
          AMQP_VHOST: "/"
        run: vendor/bin/phpunit

  # Infection runs on the newest supported PHP only. The test suite is the same on each version,
  # and a run on 8.4 and on 8.5 gave the same result, so a second run would only double the time.
  mutation:
    name: Mutation Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      POSTGRES_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=message_broker_test"
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      AMQP_HOST: 127.0.0.1
      AMQP_PORT: "5672"
      AMQP_USER: guest
      AMQP_PASSWORD: guest
      AMQP_VHOST: "/"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the PR run compares with the base branch

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, sockets, mbstring, pcntl
          coverage: pcov
          ini-values: pcov.directory=src
          tools: composer:v2

      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      # Pull request: mutate only the changed lines of src/broker/ and src/adapter/. Thresholds come from infection.json5.
      - name: Mutation tests (changed lines)
        if: github.event_name == 'pull_request'
        run: >-
          vendor/bin/infection --threads=max --no-progress --logger-github
          --git-diff-lines --git-diff-base=origin/${{ github.base_ref }}
          --ignore-msi-with-no-mutations

      # main: the full run keeps the score at or above the baseline.
      - name: Mutation tests (full)
        if: github.event_name == 'push'
        run: vendor/bin/infection --threads=max --no-progress --logger-github=false

  # Advisory: PHP 8.6 is not released yet (GA planned 2026-11-19). A failure here does not block a merge:
  # this job has continue-on-error and is not in the needs of ci-gate. In setup-php, '8.6' is the
  # nightly build from the PHP-8.6 branch. No dependency forbids PHP 8.6, so no --ignore-platform-req
  # flag is needed; if one starts to, add `--ignore-platform-req=php+` to the composer command of this job only.
  php-8-6-advisory:
    name: PHP 8.6 (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.6'
          extensions: pdo_pgsql, sockets, mbstring, pcntl
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests (unit and functional)
        env:
          POSTGRES_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=message_broker_test"
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
          AMQP_HOST: 127.0.0.1
          AMQP_PORT: "5672"
          AMQP_USER: guest
          AMQP_PASSWORD: guest
          AMQP_VHOST: "/"
        run: vendor/bin/phpunit

  # Each future package (see packages/ and "Package manifests and split rehearsal" in CLAUDE.md) is assembled in a
  # temporary folder, installed ALONE through Composer path repositories, and its tests run alone.
  # The core entry does not use the services; all entries have them for a simple matrix.
  split-rehearsal:
    name: Split rehearsal (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, postgresql, amqp]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      POSTGRES_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=message_broker_test"
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      AMQP_HOST: 127.0.0.1
      AMQP_PORT: "5672"
      AMQP_USER: guest
      AMQP_PASSWORD: guest
      AMQP_VHOST: "/"

    steps:
      - uses: actions/checkout@v7

      # pcov is only needed for Infection, which runs on main.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sockets, mbstring, pcntl
          coverage: ${{ github.event_name == 'push' && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Split rehearsal
        if: github.event_name == 'pull_request'
        run: tools/split-rehearsal.sh ${{ matrix.package }}

      - name: Split rehearsal (with Infection)
        if: github.event_name == 'push'
        run: tools/split-rehearsal.sh ${{ matrix.package }} --infection

  # The PostgreSQL contract tests and the consumer functional tests through pgbouncer in transaction mode
  # (the same settings as the pgbouncer service of compose.yaml and `make test-pgbouncer`). It keeps the
  # statement of docs/postgresql/CONNECTION_POOLING.md true. The pooler is a service, so it starts before the steps.
  # The guard test runs first: when the pooler does not rotate server connections, the other steps prove nothing.
  # PHP 8.4 only: pooling does not depend on the PHP version. The timeout stops a run that hangs on a wrong
  # pooler setting (with max_prepared_statements = 0 a run hung and a server connection went out of sync).
  pgbouncer:
    name: pgbouncer (transaction mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      # DB_HOST is the label of the postgres service on the job network. No DB_NAME: a wildcard database entry.
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.1-p0
        env:
          DB_HOST: postgres
          DB_PORT: "5432"
          DB_USER: broker
          DB_PASSWORD: broker
          AUTH_TYPE: scram-sha-256
          LISTEN_PORT: "6432"
          POOL_MODE: transaction
          SERVER_ROUND_ROBIN: "1"
          MIN_POOL_SIZE: "2"
          DEFAULT_POOL_SIZE: "4"
          # Must be above 0 (200 is the default since 1.24.0): pdo_pgsql sends the prepare and the execute as
          # separate round trips, and in transaction mode each can go to a different server connection.
          MAX_PREPARED_STATEMENTS: "200"
        ports:
          - 6432:6432
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -p 6432 -U broker -d message_broker_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    env:
      POSTGRES_DSN: "pgsql:host=127.0.0.1;port=6432;dbname=message_broker_test"
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_ROTATING_POOLER: "1"
      AMQP_HOST: 127.0.0.1
      AMQP_PORT: "5672"
      AMQP_USER: guest
      AMQP_PASSWORD: guest
      AMQP_VHOST: "/"

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sockets, mbstring, pcntl
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Guard (the pooler rotates server connections)
        run: vendor/bin/phpunit --fail-on-skipped tests/adapter/postgresql/Functional/PoolerRotationGuardTest.php

      - name: Contract tests and consumer functional tests through pgbouncer
        run: >-
          vendor/bin/phpunit
          tests/adapter/postgresql/Functional/PostgreSqlOutboxStoreContractTest.php
          tests/adapter/postgresql/Functional/PostgreSqlDeduplicationStoreContractTest.php
          tests/adapter/postgresql/Functional/PostgreSqlDeadLetterStoreContractTest.php
          tests/adapter/postgresql/Functional/PostgreSqlDeliveryStoreContractTest.php
          tests/adapter/postgresql/Functional/PdoTransactionContractTest.php
          tests/adapter/amqp/Functional/AmqpConsumerTest.php
          tests/adapter/amqp/Functional/EndToEndTest.php
          tests/adapter/amqp/Functional/ParallelConsumptionTest.php

  ci-gate:
    name: ci-gate
    if: always()
    needs: [ecs, phpstan, deptrac, functional-tests, mutation, split-rehearsal, pgbouncer]
    runs-on: ubuntu-latest
    steps:
      - uses: freyr/.github/actions/ci-gate@b0c5431e29887b95f0031751c6d92506a2b2fc81 # v2.0.0
        with:
          results: ${{ join(needs.*.result, ' ') }}
