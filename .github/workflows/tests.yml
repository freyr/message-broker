name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ecs:
    name: ECS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/ecs check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --memory-limit=-1

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: message_broker_test
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U broker"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

      rabbitmq:
        image: rabbitmq:4.3.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, sockets, mbstring, pcntl
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        env:
          POSTGRES_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=message_broker_test"
          POSTGRES_USER: broker
          POSTGRES_PASSWORD: broker
          AMQP_HOST: 127.0.0.1
          AMQP_PORT: "5672"
          AMQP_USER: guest
          AMQP_PASSWORD: guest
          AMQP_VHOST: "/"
        run: vendor/bin/phpunit

  ci-gate:
    name: ci-gate
    if: always()
    needs: [ecs, phpstan, functional-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: freyr/.github/actions/ci-gate@631e66e10bce4839aec46f7e71ed36f6c8017b16 # v1.0.1
        with:
          results: ${{ join(needs.*.result, ' ') }}
