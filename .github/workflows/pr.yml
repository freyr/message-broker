# Required checks: pr-title, version (this file) and ci-gate (tests.yml).
name: PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: freyr/.github/actions/pr-title@93b8d0f624ac287b129f2d33c838959329fdaf9d # v2.1.0

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: freyr/.github/actions/version@93b8d0f624ac287b129f2d33c838959329fdaf9d # v2.1.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
